// The messages the README's (and llms.txt's) examples use, so that ReadmeExamplesTest can compile them.
syntax = "proto3";

package protobufnio.readme;

option java_package = "io.github.quantranuk.protobuf.nio.readme";
option java_multiple_files = true;

message Ping {
  string text = 1;
}

message Pong {
  string text = 1;
}

message PriceUpdate {
  string symbol = 1;
  double price = 2;
}

message LoginRequest {
  string user = 1;
}

message OrderRequest {
  string symbol = 1;
  int64 quantity = 2;
}
